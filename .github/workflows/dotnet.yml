# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test with coverage
      run: dotnet test --no-build --verbosity normal --collect:"XPlat Code Coverage" --settings coverage.runsettings --results-directory ./TestResults
    - name: Merge coverage reports
      if: always()
      uses: danielpalme/ReportGenerator-GitHub-Action@5.4.17
      with:
        reports: TestResults/**/coverage.cobertura.xml
        targetdir: TestResults/Merged
        reporttypes: Cobertura
    - name: Generate Coverage Report
      if: always()
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: TestResults/Merged/Cobertura.xml
        badge: true
        fail_below_min: true
        format: markdown
        output: both
        thresholds: '80 80'
